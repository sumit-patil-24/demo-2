# Local / dev stack:  cp .env.example .env && docker compose up --build
#   App (Nginx + React) : http://localhost:8080
#   API via Nginx       : http://localhost:8080/api      Health: http://localhost:8080/health
# Only Nginx is published. The API and PostgreSQL are reachable only on the internal Docker network.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localbizhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-localbizhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"            # fixed: Nginx's upstream (frontend/nginx/default.conf) points at backend:5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-localbizhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-localbizhub}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ADMIN_NAME: ${ADMIN_NAME:-Site Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo@12345}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||5000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging: *logging

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    logging: *logging

volumes:
  pgdata:
