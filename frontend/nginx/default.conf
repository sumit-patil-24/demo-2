# Internet -> Nginx (this container, :8080) -> backend container (:5000)
# Logs go to stdout/stderr:  docker compose logs web
log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                'rt=$request_time upstream=$upstream_addr ustatus=$upstream_status "$http_user_agent"';
access_log /dev/stdout main;
error_log  /dev/stderr warn;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    # Docker's embedded DNS. Using variables in proxy_pass makes Nginx re-resolve "backend"
    # at request time, so a recreated backend container (new IP) does not cause 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API  -> backend. The URI is passed through unchanged (/api/...).
    location /api/ {
        set $backend http://backend:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Public health check, proxied to the backend (also verifies Nginx -> app -> DB).
    location = /health {
        set $backend_health http://backend:5000/health;
        proxy_pass $backend_health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Nginx-only liveness (used by the container HEALTHCHECK).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
