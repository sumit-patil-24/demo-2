
  deploy:
    name: Deploy to EC2
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    env:
      HOST: ${{ secrets.EC2_HOST }}
      SSH_USER: ${{ secrets.EC2_USER }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install Docker on EC2 (Ubuntu)
        run: |
          ssh "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
            set -e

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi

            sudo systemctl enable --now docker

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get install -y docker-compose-v2
            fi

            sudo docker --version
            sudo docker compose version
          REMOTE

      - name: Create application directory on EC2
        run: |
          ssh "$SSH_USER@$HOST" 'mkdir -p ~/localbizhub'

      - name: Copy compose file
        run: |
          scp docker-compose.prod.yml \
            "$SSH_USER@$HOST:~/localbizhub/docker-compose.prod.yml"

      - name: Pull images and restart
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        run: |
          set -e
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          if [ -z "$GHCR_PULL_TOKEN" ] || [ -z "$GHCR_USER" ]; then
            echo "GHCR credentials are missing."
            exit 1
          fi

          printf '%s' "$GHCR_PULL_TOKEN" |
            ssh "$SSH_USER@$HOST" \
              "sudo docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          ssh "$SSH_USER@$HOST" \
            "cd ~/localbizhub && \
             export GHCR_OWNER='$OWNER' IMAGE_TAG='${GITHUB_SHA}' && \
             sudo docker compose -f docker-compose.prod.yml pull && \
             sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
             sudo docker image prune -f"

      - name: Smoke test through Nginx
        run: |
          set -e

          for i in $(seq 1 20); do
            if curl --connect-timeout 5 --max-time 10 \
              -fsS "http://$HOST/health"; then
              echo
              echo "Deployed ${GITHUB_SHA} successfully."
              exit 0
            fi

            echo "Waiting for the application ($i/20)..."
            sleep 6
          done

          echo "Smoke test failed. Collecting diagnostics..."

          ssh "$SSH_USER@$HOST" \
            "cd ~/localbizhub && \
             sudo docker compose -f docker-compose.prod.yml ps && \
             sudo docker compose -f docker-compose.prod.yml logs --tail=50"

          exit 1
