
name: LocalBizHub CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      RUN_DB_TESTS: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Generate Prisma client and create schema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
      - name: Run tests
        run: npm test

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_DEMO_MODE: "false"

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/localbizhub-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/localbizhub-backend:latest

      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/localbizhub-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/localbizhub-web:latest

  deploy:
    name: Configure and Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Deployment Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            mkdir -p /tmp/localbizhub-deploy
            mkdir -p "$HOME/localbizhub"

      - name: Copy Production Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /tmp/localbizhub-deploy/

      - name: Configure Environment and Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_USER: localbizhub
          POSTGRES_DB: localbizhub
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USER,DOCKERHUB_TOKEN,POSTGRES_USER,POSTGRES_DB,POSTGRES_PASSWORD,JWT_SECRET,CORS_ORIGIN,IMAGE_TAG
          script: |
            set -eu

            # Install Docker if necessary.
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sudo sh /tmp/get-docker.sh
            fi

            sudo systemctl enable --now docker

            # Install the production Compose file.
            cp /tmp/localbizhub-deploy/docker-compose.prod.yml \
              "$HOME/localbizhub/docker-compose.prod.yml"

            cd "$HOME/localbizhub"

            # Generate the production environment file.
            umask 077
            printf '%s\n' \
              "DOCKER_USER=$DOCKER_USER" \
              "POSTGRES_USER=$POSTGRES_USER" \
              "POSTGRES_DB=$POSTGRES_DB" \
              "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
              "JWT_SECRET=$JWT_SECRET" \
              "CORS_ORIGIN=$CORS_ORIGIN" \
              "IMAGE_TAG=$IMAGE_TAG" \
              > .env

            # Validate Compose configuration.
            sudo docker compose \
              --env-file .env \
              -f docker-compose.prod.yml config -q

            # Authenticate to Docker Hub on EC2.
            printf '%s' "$DOCKERHUB_TOKEN" |
              sudo docker login \
                --username "$DOCKER_USER" \
                --password-stdin

            # Pull the exact images built for this commit.
            sudo docker compose \
              --env-file .env \
              -f docker-compose.prod.yml pull

            # Start or update the application.
            sudo docker compose \
              --env-file .env \
              -f docker-compose.prod.yml up -d --remove-orphans

            # Display deployment status.
            sudo docker compose \
              --env-file .env \
              -f docker-compose.prod.yml ps

            # Remove unused images.
            sudo docker image prune -f
